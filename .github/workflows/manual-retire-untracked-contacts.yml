name: Manual - Retire Untracked Contacts

# Retire ACTIVE NetSuite contacts whose company is one of our schools but
# whose id no active Contacts-tab row at that school references — legacy
# per-school records the July shared-card merge never saw (they double
# people in the invoice email picker) and people who left while the tab
# was empty (Aug 31 – Sep 2). Only records stamped "Auto-synced by School
# Sync" are ever touched. See retire_untracked_contacts.py.
#
# DRY RUN by default — run unchecked first and review the plan.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Apply changes (unchecked = dry run, report only)'
        type: boolean
        required: false
        default: false
      sales_rep:
        description: 'Optional: limit to one Sales Rep (exact match)'
        required: false
        default: ''
      school:
        description: 'Optional: limit to one School Name (exact match)'
        required: false
        default: ''

jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth
      - name: Retire untracked contacts
        run: python retire_untracked_contacts.py
        env:
          LIVE:                    ${{ inputs.live && '1' || '' }}
          SALES_REP_FILTER:        ${{ inputs.sales_rep }}
          SCHOOL_FILTER:           ${{ inputs.school }}
          NS_ACCOUNT:              ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:         ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:         ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:            ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:            ${{ secrets.NS_TOKEN_SEC }}
          NS_RESTLET_SCRIPT_ID:    ${{ secrets.NS_RESTLET_SCRIPT_ID }}
          NS_RESTLET_DEPLOY_ID:    ${{ secrets.NS_RESTLET_DEPLOY_ID }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
