name: Manual - Fix Address Names

# One-time cleanup that updates the addressee on existing NetSuite
# Ship-To address lines to the canonical school name (Full Name column).
# Run after a school rename. Kept out of the nightly push so that the
# nightly stays fast.

on:
  workflow_dispatch:
    inputs:
      sales_rep:
        description: 'Optional: limit to one Sales Rep (exact match)'
        required: false
        default: ''
      state_filter:
        description: 'Optional: WI or IL only'
        required: false
        default: ''
      school_filter:
        description: 'Optional: single school name'
        required: false
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth
      - name: Run fix
        run: python fix_address_names.py
        env:
          SALES_REP_FILTER:        ${{ inputs.sales_rep }}
          STATE_FILTER:            ${{ inputs.state_filter }}
          SCHOOL_FILTER:           ${{ inputs.school_filter }}
          NS_ACCOUNT:              ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:         ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:         ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:            ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:            ${{ secrets.NS_TOKEN_SEC }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
