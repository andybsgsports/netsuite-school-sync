name: Manual - Merge Co-op Contacts (shared cards)

# One-time migration: consolidate co-op coaches' per-school duplicate NS
# contact records into a single shared card attached to every school they
# serve (via the attach RESTlet — see RESTLET_SETUP.md). Run with live
# UNCHECKED first to review the plan; the dry-run changes nothing.
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Apply changes (unchecked = dry-run, prints plan only)'
        required: false
        default: false
        type: boolean
      email:
        description: 'Optional: limit to one person (email, exact match) for a careful first test'
        required: false
        default: ''

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth
      - name: Merge co-op contacts
        run: python merge_coop_contacts.py
        env:
          LIVE:                    ${{ inputs.live && '1' || '' }}
          EMAIL_FILTER:            ${{ inputs.email }}
          NS_ACCOUNT:              ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:         ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:         ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:            ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:            ${{ secrets.NS_TOKEN_SEC }}
          NS_RESTLET_SCRIPT_ID:    ${{ secrets.NS_RESTLET_SCRIPT_ID }}
          NS_RESTLET_DEPLOY_ID:    ${{ secrets.NS_RESTLET_DEPLOY_ID }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
