name: Manual - Purge "(Removed)" Ship-To Addresses

# One-time cleanup of the legacy "(Removed) <name>" Ship-To lines left on
# NetSuite customers by the old departure handling (which relabeled instead
# of deleting). Those lines still show in the Ship To dropdown on quotes and
# orders. The nightly sync now deletes properly; this clears the backlog.
#
# DRY RUN by default — leave `live` unchecked first to see what would go.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Apply deletions (unchecked = dry run, report only)'
        type: boolean
        required: false
        default: false
      sales_rep:
        description: 'Optional: limit to one Sales Rep (exact match)'
        required: false
        default: ''

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth
      - name: Run purge
        run: python purge_removed_addresses.py
        env:
          LIVE:                    ${{ inputs.live && '1' || '' }}
          SALES_REP_FILTER:        ${{ inputs.sales_rep }}
          NS_ACCOUNT:              ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:         ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:         ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:            ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:            ${{ secrets.NS_TOKEN_SEC }}
          NS_RESTLET_SCRIPT_ID:    ${{ secrets.NS_RESTLET_SCRIPT_ID }}
          NS_RESTLET_DEPLOY_ID:    ${{ secrets.NS_RESTLET_DEPLOY_ID }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
