name: Weekly Scores Email

on:
  schedule:
    # 12:00 UTC Monday = 7:00 AM CDT — weekly digest of last week's games
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print email content without sending'
        required: true
        default: true
        type: boolean
      dump_html:
        description: 'Dump raw schedule HTML + parse diagnostics (debugging)'
        required: false
        default: false
        type: boolean
      school_filter:
        description: 'Only check schools containing this text (blank = all)'
        required: false
        default: ''

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 msal

      - name: Run scores email
        run: python scores_email.py
        env:
          OUTLOOK_CLIENT_ID:   ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_TENANT_ID:   ${{ secrets.OUTLOOK_TENANT_ID }}
          OUTLOOK_TOKEN_CACHE: ${{ secrets.OUTLOOK_TOKEN_CACHE }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SCORES_RECIPIENT:   ${{ secrets.SCORES_RECIPIENT }}
          DRY_RUN:            ${{ inputs.dry_run == true && '1' || '0' }}
          DUMP_HTML:          ${{ inputs.dump_html == true && '1' || '0' }}
          SCHOOL_FILTER:      ${{ inputs.school_filter }}

      - name: Upload HTML dumps (debug)
        if: inputs.dump_html == true
        uses: actions/upload-artifact@v4
        with:
          name: schedule-html-dumps
          path: dump_team_*.html
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload dry-run email preview
        if: always() && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: dry_run_email.html
          retention-days: 3
          if-no-files-found: ignore
