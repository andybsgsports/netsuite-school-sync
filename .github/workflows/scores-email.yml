name: Weekly Scores Email

on:
  schedule:
    # 12:00 UTC Monday = 7:00 AM CDT — weekly digest of last week's games
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      live:
        description: 'LIVE — send to each sales rep (unchecked: all emails go to Andy)'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Dry run — print email content without sending anything'
        required: false
        default: false
        type: boolean
      week_of:
        description: 'Report the week containing this date, YYYY-MM-DD (blank = last week)'
        required: false
        default: ''
      send_empty:
        description: 'Send Andy an email even if no games were found (testing)'
        required: false
        default: false
        type: boolean
      dump_html:
        description: 'Dump raw schedule HTML + parse diagnostics (debugging)'
        required: false
        default: false
        type: boolean
      school_filter:
        description: 'Only check schools containing this text (blank = all)'
        required: false
        default: ''

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write  # commits snapshots/scores_pending.json (late-score tracker)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth pandas openpyxl msal

      - name: Run scores email
        run: python scores_email.py
        env:
          # Preferred sender: Andy's M365 mailbox via Graph (needs Mail.Send
          # consent on the token); Gmail below is the automatic fallback.
          OUTLOOK_CLIENT_ID:       ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_TENANT_ID:       ${{ secrets.OUTLOOK_TENANT_ID }}
          OUTLOOK_TOKEN_CACHE:     ${{ secrets.OUTLOOK_TOKEN_CACHE }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          # Andy's inbox for test-mode delivery and live-mode BCC. Override
          # with a SCORES_RECIPIENT repo secret if it ever changes.
          SCORES_RECIPIENT:        ${{ secrets.SCORES_RECIPIENT || 'andy@bsgsports.com' }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # Reps only receive email when the "live" box is checked (or on the
          # Monday schedule once SCORES_LIVE_DEFAULT repo variable is set to 1).
          # Otherwise every rep's email is redirected to Andy with a
          # "[TEST -> rep@...]" subject prefix.
          SCORES_LIVE:        ${{ (inputs.live == true || (github.event_name == 'schedule' && vars.SCORES_LIVE_DEFAULT == '1')) && '1' || '0' }}
          DRY_RUN:            ${{ inputs.dry_run == true && '1' || '0' }}
          SEND_EMPTY:         ${{ inputs.send_empty == true && '1' || '0' }}
          DUMP_HTML:          ${{ inputs.dump_html == true && '1' || '0' }}
          SCHOOL_FILTER:      ${{ inputs.school_filter }}
          WEEK_OF:            ${{ inputs.week_of }}

      - name: Upload HTML dumps (debug)
        if: inputs.dump_html == true
        uses: actions/upload-artifact@v4
        with:
          name: schedule-html-dumps
          path: dump_team_*.html
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload dry-run email previews
        if: always() && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: email-previews
          path: dry_run_email_*.html
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit late-score tracker
        # Only full real runs rewrite the tracker (historical, dry-run and
        # school-filtered runs never save it).
        if: inputs.week_of == '' && inputs.dry_run != true && inputs.school_filter == ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/scores_pending.json
          if git diff --cached --quiet; then
            echo "Tracker unchanged."
          else
            git commit -m "chore: update late-score tracker [skip ci]"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              echo "push attempt $i failed, retrying..."
              sleep 5
            done
          fi
