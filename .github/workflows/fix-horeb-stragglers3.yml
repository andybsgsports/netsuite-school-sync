name: Fix Horeb Stragglers 3 (deactivate-hidden-rename)

# Finds hidden "Tim Sarbacker" / "Brett Quale" contacts at NS customer 2217
# via SuiteQL, deactivates them, then renames the temp-named contacts
# (48486 "Tim SarbackerFIX2217", 48485 "Brett QualeFIX2217") back to
# their real names.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/fix-horeb-stragglers3.yml']
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Deactivate hidden duplicates and restore real names
        run: python fix_horeb_stragglers3.py
        env:
          NS_ACCOUNT:              ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:         ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:         ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:            ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:            ${{ secrets.NS_TOKEN_SEC }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
