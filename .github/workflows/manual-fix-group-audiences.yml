name: Manual - Fix Group Audiences

# Adds an "Inactive = No" filter to the saved searches behind the coach
# Groups (Baseball Coaches, Boys Football Coaches, Athletic Directors,
# etc.) so retired duplicate contacts stop showing up as members, scopes
# each to only schools where sales_rep_id is the NS Sales Rep, and swaps
# a bare Phone column for Company where present. One-time fix — NetSuite
# recomputes each group from its search on every view, so nothing needs
# to run again once these are corrected. See fix_group_audiences.py and
# suitescript/group_audience_restlet.js.
#
# Requires the group_audience_restlet.js RESTlet to be deployed first
# (see GROUP_AUDIENCE_RESTLET_SETUP.md) and NS_GROUP_RESTLET_SCRIPT_ID /
# NS_GROUP_RESTLET_DEPLOY_ID set as repo secrets, plus search_ids_json —
# CRM Group records aren't reachable from SuiteScript (or REST) at all,
# so this needs each saved search's own internal id, not the group's.
#
# DRY RUN by default — run unchecked first and review the plan.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Apply changes (unchecked = dry run, report only)'
        type: boolean
        required: false
        default: false
      search_ids_json:
        description: 'Required: {"Baseball Coaches": 12345, ...} — internal ids of the 13 saved searches (Lists > Search > Saved Searches, Type=Contact)'
        required: false
        default: ''
      sales_rep_id:
        description: 'NS employee id to scope each search to (default 3 = Andrew Murray). Leave blank to skip sales-rep scoping and only fix the inactive filter.'
        required: false
        default: '3'
      debug_filters:
        description: 'Print each search''s raw filters array (debugging only)'
        type: boolean
        required: false
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth
      - name: Fix group audiences
        run: python fix_group_audiences.py
        env:
          LIVE:                       ${{ inputs.live && '1' || '' }}
          SEARCH_IDS_JSON:            ${{ inputs.search_ids_json }}
          SALES_REP_ID:               ${{ inputs.sales_rep_id }}
          DEBUG_FILTERS:              ${{ inputs.debug_filters && '1' || '' }}
          NS_ACCOUNT:                 ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:            ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:            ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:               ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:               ${{ secrets.NS_TOKEN_SEC }}
          NS_GROUP_RESTLET_SCRIPT_ID: ${{ secrets.NS_GROUP_RESTLET_SCRIPT_ID }}
          NS_GROUP_RESTLET_DEPLOY_ID: ${{ secrets.NS_GROUP_RESTLET_DEPLOY_ID }}
