name: Secret Scan (gitleaks)

# Runs gitleaks on every push and pull request. If a commit introduces
# anything matching NetSuite-style OAuth tokens, AWS keys, GitHub PATs,
# or any other secret pattern in gitleaks's default rules, the job fails
# and (for a PR) blocks the merge.
#
# Config: .gitleaks.toml at repo root.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for scanning prior commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2's breaking change: PR scans
          # need a token to diff the PR commits. Without it the action errors
          # out before scanning ("GITHUB_TOKEN is now required to scan PRs").
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action emits a SARIF report when this is set; uploaded
          # below for GitHub's security tab.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Upload report (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
