name: Manual - Fix Company Names

# Quick targeted PATCH of the Customer.companyName field on every school
# from the Schools tab "Full Name" column. ~5 min for the full list,
# vs ~5 hours for the regular nightly NS push.

on:
  workflow_dispatch:
    inputs:
      sales_rep:
        description: 'Optional: limit to one Sales Rep (exact match)'
        required: false
        default: ''
      state_filter:
        description: 'Optional: WI or IL only (blank = all)'
        required: false
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Run fix
        run: python fix_company_names.py
        env:
          SALES_REP_FILTER:        ${{ inputs.sales_rep }}
          STATE_FILTER:            ${{ inputs.state_filter }}
          NS_ACCOUNT:              ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:         ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:         ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:            ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:            ${{ secrets.NS_TOKEN_SEC }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
