name: Fix Horeb Stragglers

# One-off repair for Tim Sarbacker and Brett Quale at Mt. Horeb High School.
# Both contacts are linked to the district parent (2290) in NS but should be
# on the HS sub-customer (2217). The nightly sync can't move them because NS
# rejects the PATCH with a "unique name" collision — 2217 already has a
# contact with those names. This script finds the HS-native contact by
# name/email, patches it with current data, and repoints the sheet rows.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/fix-horeb-stragglers.yml']
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Fix Horeb straggler contacts
        run: python fix_horeb_stragglers.py
        env:
          NS_ACCOUNT:              ${{ secrets.NS_ACCOUNT }}
          NS_CONSUMER_KEY:         ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SEC:         ${{ secrets.NS_CONSUMER_SEC }}
          NS_TOKEN_KEY:            ${{ secrets.NS_TOKEN_KEY }}
          NS_TOKEN_SEC:            ${{ secrets.NS_TOKEN_SEC }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
