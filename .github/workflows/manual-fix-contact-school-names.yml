name: Manual - Fix Contact School Names

# Manual repair for school renames: rewrites Contacts-tab School Name
# cells to match the canonical Schools-tab name (resolved by NS Customer
# ID, else by normalized-name match) and merges the duplicate rows a
# rename leaves behind, keeping NS ids intact. The nightly jobs run the
# same heal automatically; use this to fix things up on demand.
#
# Run once with "live" unchecked to review the plan, then again with it
# checked to apply.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Apply the changes (unchecked = dry run, prints the plan only)'
        required: false
        default: false
        type: boolean

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Run fix
        run: python fix_contact_school_names.py
        env:
          LIVE:                    ${{ inputs.live && '1' || '' }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
